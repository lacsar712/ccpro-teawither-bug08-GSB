{% extends "base.html" %}
{% block title %}删除茶园{% endblock %}
{% block content %}
<div class="page-header">
  <h1>删除茶园</h1>
</div>
<div class="card">
  {% if trough_count %}
  <p>茶园「{{ object.name }}」下仍有 <strong>{{ trough_count }}</strong> 个萎凋槽，不能删除。请先删除或转移这些槽位。</p>
  <div class="actions">
    <a class="btn btn-secondary" href="{% url 'garden_list' %}">返回列表</a>
  </div>
  {% else %}
  <p>确认删除茶园「{{ object.name }}」？该茶园当前没有槽位，删除后不可恢复。</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">确认删除</button>
    <a class="btn btn-secondary" href="{% url 'garden_list' %}">取消</a>
  </form>
  {% endif %}
</div>
{% endblock %}
